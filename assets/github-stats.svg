    <text class="title" x="22" y="0">GitHub at a glance</text>
  </g>

  <!-- Stat Rows -->
  <g transform="translate(28, 54)">
    <!-- Row 1: Total Stars -->
    <g class="stat-row" transform="translate(0, 20)">
      <path class="icon" d="M 0 -10 L 2.4 -2.8 L 10 -2.8 L 3.8 1.6 L 6.2 9 L 0 4.4 L -6.2 9 L -3.8 1.6 L -10 -2.8 L -2.4 -2.8 Z" transform="translate(10, 2) scale(0.7)"/>
      <text class="label" x="26" y="5">Total Stars Earned:</text>
