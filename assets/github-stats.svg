      <stop offset="50%" stop-color="#C9A27A"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>
    <linearGradient id="card-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .gs-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #F8F0F3; letter-spacing: -0.3px; }
    .gs-sub   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #C77B9B; letter-spacing: 1.5px; }
    .gs-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #E5B5C7; letter-spacing: 1px; }
    .gs-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #C77B9B; letter-spacing: 1.2px; }
    .gs-val   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 32px; font-weight: 800; fill: #F8F0F3; }
    .gs-desc  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #B6A3AC; }
    .gs-strip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #C77B9B; letter-spacing: 0.8px; }
    .gs-strip-val { font-weight: 700; fill: #F8F0F3; }
    .gs-icon  { fill: #C77B9B; }
    
    .border-trace {
      stroke-dasharray: 400 2560;
      stroke-dashoffset: 2960;
      animation: trace-move 10s linear infinite;
    }
    @keyframes trace-move {
      to { stroke-dashoffset: 0; }
    }
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    @media (prefers-reduced-motion: reduce) {
      .border-trace, .pulse-dot { animation: none !important; }
    }
  </style>

