<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Vaibhav Rastogi — Backend Systems Engineer &amp; Distributed Architect</title>
  <desc id="hero-desc">Building distributed systems that fail safely and scale silently. B.Tech in Information Technology at KIET Group of Institutions, CGPA 8.30. Patent Filed for Saarthi AR/VR Platform. GATE 2026 CS.</desc>

  <defs>
    <radialGradient id="hero-bg" cx="72%" cy="38%" r="80%">
      <stop offset="0" stop-color="#2A0E1B"/>
      <stop offset=".55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </radialGradient>
    <radialGradient id="hero-light-a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-light-b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".28"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-name-grad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset=".55" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <linearGradient id="hero-sheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;760 0;760 0" keyTimes="0;.35;1" dur="8s" begin="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5B5C7" stop-opacity=".07"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset=".2" stop-color="#E5B5C7"/>
      <stop offset=".75" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-orbit-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity=".6"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="hero-grid-fade" cx="68%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="hero-grid-mask">
      <rect width="1200" height="480" fill="url(#hero-grid-fade)"/>
    </mask>
    <filter id="hero-glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hero-arch"><path d="M847 380 V202 A118 118 0 0 1 1083 202 V380 Z"/></clipPath>
    <radialGradient id="hero-arch-wash" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#321324"/>
      <stop offset=".6" stop-color="#1F0C16"/>
      <stop offset="1" stop-color="#10070C"/>
    </radialGradient>
    <linearGradient id="hero-arch-grade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#27101C" stop-opacity="0"/>
      <stop offset=".85" stop-color="#27101C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#10070C" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="hero-arch-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-frame-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5B5C7"/>
      <stop offset=".5" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#C9A27A"/>
    </linearGradient>
    <clipPath id="hero-clip"><rect width="1200" height="480" rx="20"/></clipPath>
  </defs>

  <style>
    .hero-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .hero-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .hero-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .hero-rise { animation: hero-rise 1.4s cubic-bezier(.16,1,.3,1) both; }
    .hero-fade { animation: hero-fade 1.6s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .9s; }  .d5 { animation-delay: 1.2s; } .d6 { animation-delay: 1.5s; }

    .hero-draw   { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.4s cubic-bezier(.65,0,.35,1) .9s forwards; }
    .hero-signal { stroke-dasharray: 500; stroke-dashoffset: 500; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 2.2s forwards; }

    .hero-portal { animation: hero-photo 1.6s cubic-bezier(.16,1,.3,1) .5s both; }
    .hero-frame  { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes hero-photo { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
    @keyframes hero-rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes hero-fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hero-draw  { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .hero-rise, .hero-fade, .hero-portal { animation: none; }
      .hero-frame { animation: none; stroke-dashoffset: 0; }
      .hero-draw, .hero-signal { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <!-- Base Background -->
    <rect width="1200" height="480" fill="url(#hero-bg)"/>

    <!-- Ambient Slow Light Fields -->
    <ellipse cx="900" cy="140" rx="420" ry="300" fill="url(#hero-light-a)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 30; 0 0" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>
    <ellipse cx="180" cy="460" rx="360" ry="220" fill="url(#hero-light-b)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 -25; 0 0" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>

    <!-- Technical Edge-Masked Grid -->
    <rect width="1200" height="480" fill="url(#hero-grid)" mask="url(#hero-grid-mask)"/>

    <!-- Slow Scan Line across the grid -->
    <rect x="0" y="-140" width="1200" height="140" fill="url(#hero-scan)">
      <animate attributeName="y" values="-140;480" dur="11s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Drifting Micro-Particles -->
    <g fill="#E5B5C7">
      <circle cx="560" cy="120" r="1.4"><animate attributeName="opacity" values="0;.9;0" dur="4.2s" repeatCount="indefinite"/><animate attributeName="cy" values="120;96" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="1.1"><animate attributeName="opacity" values="0;.8;0" dur="5.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="70;48" dur="5.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="380" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="4.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="380;352" dur="4.8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="420" r="1.2"><animate attributeName="opacity" values="0;.7;0" dur="6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" values="420;396" dur="6s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="60" r="1.3"><animate attributeName="opacity" values="0;.85;0" dur="5s" begin="3s" repeatCount="indefinite"/><animate attributeName="cy" values="60;40" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="250" r="1"><animate attributeName="opacity" values="0;.7;0" dur="4.4s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="250;226" dur="4.4s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Concentric Orbital System circling the arch -->
    <g transform="translate(965 232)" class="hero-fade d3">
      <circle r="212" fill="none" stroke="#C77B9B" stroke-opacity=".1" stroke-dasharray="1 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="140s" repeatCount="indefinite"/>
      </circle>
      <circle r="190" fill="none" stroke="url(#hero-orbit-grad)" stroke-width="1"/>
      <circle r="160" fill="none" stroke="#C77B9B" stroke-opacity=".16" stroke-dasharray="2 7"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="95s" repeatCount="indefinite"/>
        <circle cx="0" cy="160" r="2.5" fill="#F8F0F3"/>
        <circle cx="-160" cy="0" r="2" fill="#C77B9B" fill-opacity=".7"/>
      </g>
    </g>

    <!-- Architectural Roman Arch Centerpiece -->
    <g class="hero-portal">
      <path d="M835 392 V202 A130 130 0 0 1 1095 202 V392 Z" fill="none" stroke="#C77B9B" stroke-opacity=".25">
        <animate attributeName="stroke-opacity" values=".15;.5;.15" dur="5s" repeatCount="indefinite"/>
      </path>

      <!-- Inside Arch: Geometric Systems Graph + Monogram -->
      <g clip-path="url(#hero-arch)">
        <rect x="847" y="84" width="236" height="296" fill="url(#hero-arch-wash)"/>

        <!-- Network graph lines -->
        <g stroke="#C77B9B" stroke-opacity=".28" stroke-width="1">
          <line x1="885" y1="180" x2="965" y2="135"/>
          <line x1="965" y1="135" x2="1045" y2="180"/>
          <line x1="965" y1="135" x2="965" y2="236"/>
          <line x1="885" y1="275" x2="965" y2="236"/>
          <line x1="1045" y1="275" x2="965" y2="236"/>
          <line x1="885" y1="180" x2="885" y2="275"/>
          <line x1="1045" y1="180" x2="1045" y2="275"/>
        </g>

        <!-- Network node dots -->
        <circle cx="965" cy="135" r="4.5" fill="#E5B5C7" filter="url(#hero-glow)"/>
        <circle cx="885" cy="180" r="3.5" fill="#C77B9B"/>
        <circle cx="1045" cy="180" r="3.5" fill="#C77B9B"/>
        <circle cx="885" cy="275" r="3.5" fill="#701A3D"/>
        <circle cx="1045" cy="275" r="3.5" fill="#701A3D"/>

        <!-- Central VR Monogram Core -->
        <circle cx="965" cy="236" r="38" fill="#1C0913" stroke="#E5B5C7" stroke-width="1.2"/>
        <circle cx="965" cy="236" r="32" fill="#2E0E1F" stroke="#C77B9B" stroke-opacity=".5"/>
        <text class="hero-serif" x="965" y="244" font-size="24" font-weight="300" font-style="italic" fill="#F8F0F3" text-anchor="middle" letter-spacing="1">VR</text>

        <!-- Status tags inside arch -->
        <text class="hero-mono" x="965" y="322" font-size="10" letter-spacing="2.4" fill="#E5B5C7" text-anchor="middle">DISTRIBUTED</text>
        <text class="hero-mono" x="965" y="338" font-size="8.5" letter-spacing="1.8" fill="#B6A3AC" text-anchor="middle">SYSTEMS ARCHITECT</text>

        <!-- Grade overlay -->
        <rect x="847" y="84" width="236" height="296" fill="url(#hero-arch-grade)"/>

        <!-- Skew sheen sweep -->
        <rect x="700" y="84" width="90" height="296" fill="url(#hero-arch-sheen)" transform="skewX(-14)">
          <animate attributeName="x" values="700;1260;1260" keyTimes="0;.35;1" dur="9s" begin="3.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Precision Frame Outline with self-drawing stroke -->
      <path class="hero-frame" d="M847 380 V202 A118 118 0 0 1 1083 202 V380 Z" fill="none" stroke="url(#hero-frame-grad)" stroke-width="1.5"/>

      <!-- Crosshair Accents -->
      <path d="M829 290 v-22 h22" fill="none" stroke="#E5B5C7" stroke-opacity=".8"/>
      <path d="M1101 398 v-22 M1101 398 h-22" fill="none" stroke="#E5B5C7" stroke-opacity=".8"/>
    </g>

    <!-- Orbital System Labels -->
    <g transform="translate(965 232)" class="hero-fade d4">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
        <circle cx="190" cy="0" r="3.5" fill="#E5B5C7" filter="url(#hero-glow)"/>
        <circle cx="-134" cy="-134" r="2" fill="#C77B9B"/>
      </g>
      <!-- Distributed Architecture Domain Labels -->
      <g class="hero-mono" font-size="10.5" letter-spacing="1.6" fill="#B6A3AC">
        <g transform="translate(-124 -152)"><circle r="3" fill="#C77B9B"/><text x="10" y="4">KAFKA</text></g>
        <g transform="translate(150 -96)"><circle r="3" fill="#C77B9B"/><text x="10" y="4">RAFT</text></g>
        <g transform="translate(150 110)"><circle r="3" fill="#C77B9B"/><text x="10" y="4">APIS</text></g>
        <g transform="translate(-160 40)"><circle r="3" fill="#C77B9B"/><text x="-14" y="4" text-anchor="end">SRE</text></g>
      </g>
    </g>

    <!-- Signal path drawing itself through the composition -->
    <path class="hero-signal" d="M600 342 C 680 338, 740 330, 780 318 S 828 300, 847 300" fill="none" stroke="#C77B9B" stroke-opacity=".5" stroke-width="1.2"/>
    <circle cx="600" cy="342" r="3" fill="#F8F0F3" filter="url(#hero-glow)" opacity=".9">
      <animateMotion dur="5s" repeatCount="indefinite" begin="4.4s" path="M600 342 C 680 338, 740 330, 780 318 S 828 300, 847 300" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/>
    </circle>

    <!-- Top Terminal Pill Indicator -->
    <g class="hero-fade d1" transform="translate(72 64)">
      <rect width="322" height="34" rx="17" fill="#190B12" stroke="#C77B9B" stroke-opacity=".25"/>
      <circle cx="20" cy="17" r="4" fill="#C77B9B">
        <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text class="hero-mono" x="34" y="21.5" font-size="12" fill="#B6A3AC">~/vaibhav<tspan fill="#C77B9B"> $ </tspan><tspan fill="#F8F0F3">build --distributed</tspan></text>
      <rect x="300" y="10" width="7" height="14" fill="#E5B5C7">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Eyebrow Strip -->
    <g class="hero-rise d2">
      <line x1="72" y1="136" x2="104" y2="136" stroke="#C77B9B"/>
      <text class="hero-mono" x="116" y="140" font-size="12" letter-spacing="3.2" fill="#C77B9B">BACKEND · DISTRIBUTED ARCHITECTURE · SRE</text>
    </g>

    <!-- Name in 2 lines with Huge Serif Typography -->
    <text class="hero-serif hero-rise d3" x="68" y="230" font-size="92" font-weight="300" letter-spacing="-2.5" fill="#F8F0F3">Vaibhav</text>
    <text class="hero-serif hero-rise d4" x="68" y="318" font-size="92" font-style="italic" font-weight="300" letter-spacing="-2.5" fill="url(#hero-name-grad)">Rastogi<tspan fill="#C77B9B">.</tspan></text>

    <!-- Light sweeping across the name -->
    <g class="hero-fade d6" pointer-events="none">
      <text class="hero-serif" x="68" y="230" font-size="92" font-weight="300" letter-spacing="-2.5" fill="url(#hero-sheen)">Vaibhav</text>
      <text class="hero-serif" x="68" y="318" font-size="92" font-style="italic" font-weight="300" letter-spacing="-2.5" fill="url(#hero-sheen)">Rastogi.</text>
    </g>

    <!-- Glowing underline curve -->
    <path class="hero-draw" d="M72 346 C 220 340, 420 352, 600 342" fill="none" stroke="url(#hero-rule)" stroke-width="2" stroke-linecap="round" filter="url(#hero-glow)"/>

    <!-- Subtitle & Motto -->
    <text class="hero-mono hero-rise d5" x="72" y="384" font-size="13" letter-spacing="2.6" fill="#F8F0F3">BACKEND SYSTEMS ENGINEER  ·  DISTRIBUTED ARCHITECT</text>
    <text class="hero-serif hero-rise d6" x="72" y="420" font-size="19" font-style="italic" fill="#B6A3AC">Building distributed systems that fail safely and scale silently.</text>

    <!-- Bottom Meta Strip -->
    <g class="hero-fade d6">
      <line x1="72" y1="446" x2="1128" y2="446" stroke="#C77B9B" stroke-opacity=".14"/>
      <text class="hero-mono" x="72" y="466" font-size="10.5" letter-spacing="2" fill="#B6A3AC">B.TECH IT · KIET GROUP OF INSTITUTIONS · CGPA 8.30</text>
      <text class="hero-mono" x="1128" y="466" text-anchor="end" font-size="10.5" letter-spacing="2" fill="#E5B5C7">PATENT FILED (SAARTHI AR/VR) · GATE 2026 CS</text>
    </g>

    <!-- Outer Frame -->
    <rect x=".5" y=".5" width="1199" height="479" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".18"/>
  </g>
</svg>
