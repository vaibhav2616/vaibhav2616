<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ce-t ce-d">
  <title id="ce-t">Certifications &amp; Credentials</title>
  <desc id="ce-d">AWS Certified Cloud Practitioner, AWS Generative AI Practitioner, Cisco Networking Essentials, Introduction to Modern AI, Palo Alto Networks Cybersecurity Fundamentals, and Linux Command Line Infosys Springboard.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".5"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F0F3"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ce-tile  { animation: ce-in 1s cubic-bezier(.34,1.3,.64,1) both; }
    .ce-edge  { stroke-dasharray: 1028; stroke-dashoffset: 1028; animation: ce-edge 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes ce-edge { 0% { stroke-dashoffset: 1028; opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 60%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ce-tile { animation: none; } .ce-edge { display: none; } }
  </style>

  <rect width="1200" height="420" rx="20" fill="url(#ce-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ce-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>

  <!-- Row 1: 3 Tiles -->
  <!-- Tile 1: AWS Cloud Practitioner -->
  <g class="ce-tile" style="animation-delay:0.20s"><g transform="translate(40 40)">
    <rect width="354" height="160" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="354" height="160" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.00s"/>
    <text class="ce-mono" x="22" y="34" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">AWS · JAN 2026</text>
    <circle cx="326" cy="30" r="3.5" fill="#C77B9B"/><circle cx="314" cy="30" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="50" x2="332" y2="50" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-sans" x="22" y="82" font-size="15" font-weight="500" fill="#F8F0F3">AWS Certified Cloud Practitioner</text>
    <text class="ce-sans" x="22" y="106" font-size="13.5" fill="#B6A3AC">Amazon Web Services</text>
    <text class="ce-mono" x="22" y="130" font-size="11" fill="#E5B5C7">Cloud Architecture &amp; Core Infrastructure</text>
  </g></g>

  <!-- Tile 2: AWS Generative AI Practitioner -->
  <g class="ce-tile" style="animation-delay:0.35s"><g transform="translate(423 40)">
    <rect width="354" height="160" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="354" height="160" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.35s"/>
    <text class="ce-mono" x="22" y="34" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">AWS · JAN 2026</text>
    <circle cx="326" cy="30" r="3.5" fill="#C77B9B"/><circle cx="314" cy="30" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="50" x2="332" y2="50" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-sans" x="22" y="82" font-size="15" font-weight="500" fill="#F8F0F3">AWS Generative AI Practitioner</text>
    <text class="ce-sans" x="22" y="106" font-size="13.5" fill="#B6A3AC">Amazon Web Services</text>
    <text class="ce-mono" x="22" y="130" font-size="11" fill="#E5B5C7">Foundation Models &amp; GenAI Pipelines</text>
  </g></g>

  <!-- Tile 3: Cisco Networking Essentials -->
  <g class="ce-tile" style="animation-delay:0.50s"><g transform="translate(806 40)">
    <rect width="354" height="160" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="354" height="160" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.70s"/>
    <text class="ce-mono" x="22" y="34" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">CISCO · APR 2026</text>
    <circle cx="326" cy="30" r="3.5" fill="#C77B9B"/><circle cx="314" cy="30" r="3.5" fill="#C77B9B"/><circle cx="302" cy="30" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="50" x2="332" y2="50" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-sans" x="22" y="82" font-size="15" font-weight="500" fill="#F8F0F3">Cisco Networking Essentials</text>
    <text class="ce-sans" x="22" y="106" font-size="13.5" fill="#B6A3AC">Cisco Networking Academy (CCNA track)</text>
    <text class="ce-mono" x="22" y="130" font-size="11" fill="#E5B5C7">IP Routing, Switching &amp; Network Defense</text>
  </g></g>

  <!-- Row 2: 3 Tiles -->
  <!-- Tile 4: Introduction to Modern AI -->
  <g class="ce-tile" style="animation-delay:0.65s"><g transform="translate(40 220)">
    <rect width="354" height="160" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="354" height="160" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:3.05s"/>
    <text class="ce-mono" x="22" y="34" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">AI &amp; ML · MAY 2026</text>
    <circle cx="326" cy="30" r="3.5" fill="#C77B9B"/><circle cx="314" cy="30" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="50" x2="332" y2="50" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-sans" x="22" y="82" font-size="15" font-weight="500" fill="#F8F0F3">Introduction to Modern AI</text>
    <text class="ce-sans" x="22" y="106" font-size="13.5" fill="#B6A3AC">Applied Machine Learning</text>
    <text class="ce-mono" x="22" y="130" font-size="11" fill="#E5B5C7">Neural Networks &amp; Deep Learning Fundamentals</text>
  </g></g>

  <!-- Tile 5: Palo Alto Networks Cybersecurity -->
  <g class="ce-tile" style="animation-delay:0.80s"><g transform="translate(423 220)">
    <rect width="354" height="160" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="354" height="160" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:3.40s"/>
    <text class="ce-mono" x="22" y="34" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">PALO ALTO NETWORKS</text>
    <circle cx="326" cy="30" r="3.5" fill="#C77B9B"/><circle cx="314" cy="30" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="50" x2="332" y2="50" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-sans" x="22" y="82" font-size="15" font-weight="500" fill="#F8F0F3">Cybersecurity Fundamentals</text>
    <text class="ce-sans" x="22" y="106" font-size="13.5" fill="#B6A3AC">Palo Alto Networks (PCCET Gateway)</text>
    <text class="ce-mono" x="22" y="130" font-size="11" fill="#E5B5C7">Zero Trust Architecture &amp; Threat Defense</text>
  </g></g>

  <!-- Tile 6: Linux Command Line (Infosys) -->
  <g class="ce-tile" style="animation-delay:0.95s"><g transform="translate(806 220)">
    <rect width="354" height="160" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".24"/>
    <rect width="354" height="160" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:3.75s"/>
    <text class="ce-mono" x="22" y="34" font-size="11.5" letter-spacing="2.6" fill="#C77B9B">INFOSYS SPRINGBOARD</text>
    <circle cx="326" cy="30" r="3.5" fill="#C77B9B"/>
    <line x1="22" y1="50" x2="332" y2="50" stroke="#C77B9B" stroke-opacity=".15"/>
    <text class="ce-sans" x="22" y="82" font-size="15" font-weight="500" fill="#F8F0F3">Linux Command Line</text>
    <text class="ce-sans" x="22" y="106" font-size="13.5" fill="#B6A3AC">Infosys Springboard</text>
    <text class="ce-mono" x="22" y="130" font-size="11" fill="#E5B5C7">Shell Scripting, OS Internals &amp; POSIX</text>
  </g></g>
</svg>
