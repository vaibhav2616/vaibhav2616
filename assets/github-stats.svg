  <defs>
    <linearGradient id="bg-burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="60%" stop-color="#14080F"/>
      <stop offset="100%" stop-color="#0F050A"/>
    </linearGradient>
    <radialGradient id="glow-burgundy" cx="20%" cy="0%" r="60%">
