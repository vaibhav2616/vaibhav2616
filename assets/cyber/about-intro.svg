<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Vaibhav Rastogi</title>
  <desc id="ab-d">Backend Systems Engineer and Distributed Systems Architect. B.Tech in Information Technology at KIET Group of Institutions, CGPA 8.30. Backend Systems Intern at OrganicSabziwala. Shipped Saarthi AR/VR Platform (Patent Filed), Distributed Payment Engine, Microservice Chassis, and SRE Incident Triage Agent. Core languages Python, FastAPI, C++; drawn to distributed consensus, Kafka, and fault-tolerant architecture.</desc>
