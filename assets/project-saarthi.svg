<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Saarthi: AR/VR Cultural Heritage Preservation Platform (Patent Filed)</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="p4-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in    { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1    { animation-delay: .15s; } .p4-d2 { animation-delay: .4s; }
    .p4-chip  { animation: p4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p4-draw  { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in, .p4-chip { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
    .p4-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p4-trace 7s linear infinite; }
    @keyframes p4-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-trace { display: none; } }
  </style>

  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>

    <!-- Left Column: Content & Metrics -->
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">01 · SPATIAL COMPUTING · PATENT FILED · 2024</text>
      <text class="p4-serif" x="54" y="126" font-size="50" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Saarthi AR/VR Platform</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Immersive 3D cultural reconstruction platform with spatial photogrammetry &amp; interactive physics.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Unity 3D spatial engine + real-time rendering + Indian Patent Office filing</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>

      <g transform="translate(56 266)">
        <text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">Patent</text>
        <text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">filed with Indian Patent Office</text>
      </g>
      <g transform="translate(261 266)">
        <text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">60 FPS</text>
        <text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">steady frame budget in WebXR</text>
      </g>
      <g transform="translate(466 266)">
        <text class="p4-serif" font-size="34" font-weight="300" fill="#F8F0F3">100%</text>
        <text class="p4-sans" y="24" font-size="12.5" fill="#B6A3AC">spatial audio fidelity</text>
      </g>

      <!-- Chips -->
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Unity 3D</text></g>
      <g class="p4-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="56" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="162" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">C#</text></g>
      <g class="p4-chip" style="animation-delay:1.24s"><rect x="198" y="314" width="76" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="236" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">WebXR</text></g>
      <g class="p4-chip" style="animation-delay:1.36s"><rect x="282" y="314" width="76" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="320" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Blender</text></g>
      <g class="p4-chip" style="animation-delay:1.48s"><rect x="366" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p4-mono" x="401" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Python</text></g>
    </g>

    <!-- Right Column: Flow Telemetry Diagram with Bezier Pipes & Animated Moving Packet -->
    <g class="p4-in p4-d2"><g transform="translate(0 35)">
      <g transform="translate(750 40)" class="p4-mono" font-size="13" text-anchor="middle">
        <text x="12" y="20" text-anchor="start" font-size="10.5" letter-spacing="2.4" fill="#B6A3AC">PHOTOGRAMMETRY → UNITY XR → SPATIAL AUDIO</text>
        <path d="M12 120 H70" stroke="#C77B9B" stroke-opacity=".5"/>
        <!-- Bezier pipeline curves -->
        <path class="p4-draw" d="M190 120 C 240 120, 250 64, 300 64" fill="none" stroke="#E5B5C7" stroke-width="1.5"/>
        <path d="M190 120 C 240 120, 250 176, 300 176" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-dasharray="4 6"/>
        
        <!-- Processing Node -->
        <rect x="70" y="98" width="120" height="44" rx="22" fill="#27101C" stroke="#C77B9B" stroke-opacity=".5"/>
        <text x="130" y="125" fill="#F8F0F3">Spatial 3D</text>
        
        <!-- Unity Engine Node -->
        <rect x="300" y="42" width="126" height="44" rx="22" fill="#451126" stroke="#E5B5C7"/>
        <text x="363" y="69" fill="#F8F0F3">Unity Physics</text>

        <!-- WebXR Output Node -->
        <rect x="300" y="154" width="126" height="44" rx="22" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/>
        <text x="363" y="181" fill="#B6A3AC">WebXR Low-Lat</text>

        <!-- Glowing moving packet dot -->
        <circle r="4.5" fill="#F8F0F3" filter="url(#p4-glowf)">
          <animateMotion dur="3.6s" repeatCount="indefinite" path="M12 120 H130 C 220 120, 250 64, 363 64" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/>
        </circle>
        <text x="12" y="236" text-anchor="start" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">spatial anchor tracking · 60 FPS VR mesh budget</text>
      </g>
    </g></g>

    <!-- Outer card border & continuous laser trace -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p4-trace" style="animation-delay:-2.2s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
