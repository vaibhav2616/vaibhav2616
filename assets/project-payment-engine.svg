  <text x="44" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7FB3E0" opacity="0.7">✦ ACID compliance via Django ORM  ✦ Real-time Kafka event broadcasting  ✦ Microservice isolation pattern  ✦ Dual gateway architecture</text>
