<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="cert-t cert-d">
  <title id="cert-t">Certifications</title>
  <desc id="cert-d">AWS Certified Cloud Practitioner, AWS Generative AI Practitioner, Cisco Networking Essentials, Intro to Modern AI, Palo Alto Cybersecurity, Linux CLI Infosys.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="ce-glow" cx="80%" cy="20%" r="70%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ce-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ce-card { animation: ce-in 1s cubic-bezier(.16,1,.3,1) both; }
    .c1 { animation-delay: .05s; } .c2 { animation-delay: .2s; } .c3 { animation-delay: .35s; }
    .c4 { animation-delay: .5s; }  .c5 { animation-delay: .65s; } .c6 { animation-delay: .8s; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .ce-trace { stroke-dasharray: 200 1100; stroke-dashoffset: 1300; animation: ce-trace 6s linear infinite; }
    @keyframes ce-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ce-card { animation: none; }
      .ce-trace { display: none; }
    }
  </style>

  <rect width="1200" height="320" rx="20" fill="url(#ce-bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#ce-glow)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>

  <!-- Row 1 -->
  <!-- Cert 1: AWS Cloud Practitioner -->
  <g class="ce-card c1" transform="translate(32 30)">
    <rect width="360" height="120" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect class="ce-trace" style="animation-delay:0s" width="360" height="120" rx="12" fill="none" stroke="url(#ce-trace)" stroke-width="1.2" stroke-linecap="round"/>
    <text class="ce-mono" x="20" y="30" font-size="10" letter-spacing="2.2" fill="#C77B9B">AWS · JAN 2026</text>
    <text class="ce-serif" x="20" y="64" font-size="20" font-weight="300" fill="#F8F0F3">Cloud Practitioner</text>
    <text class="ce-sans" x="20" y="88" font-size="12" fill="#B6A3AC">Amazon Web Services · Core Cloud Architecture</text>
  </g>

  <!-- Cert 2: AWS GenAI Practitioner -->
  <g class="ce-card c2" transform="translate(420 30)">
    <rect width="360" height="120" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect class="ce-trace" style="animation-delay:-1s" width="360" height="120" rx="12" fill="none" stroke="url(#ce-trace)" stroke-width="1.2" stroke-linecap="round"/>
    <text class="ce-mono" x="20" y="30" font-size="10" letter-spacing="2.2" fill="#C77B9B">AWS · JAN 2026</text>
    <text class="ce-serif" x="20" y="64" font-size="20" font-weight="300" fill="#F8F0F3">Generative AI Practitioner</text>
    <text class="ce-sans" x="20" y="88" font-size="12" fill="#B6A3AC">Amazon Web Services · Foundation Models &amp; LLMs</text>
  </g>

  <!-- Cert 3: Cisco Networking CCNA -->
  <g class="ce-card c3" transform="translate(808 30)">
    <rect width="360" height="120" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect class="ce-trace" style="animation-delay:-2s" width="360" height="120" rx="12" fill="none" stroke="url(#ce-trace)" stroke-width="1.2" stroke-linecap="round"/>
    <text class="ce-mono" x="20" y="30" font-size="10" letter-spacing="2.2" fill="#C77B9B">CISCO · APR 2026</text>
    <text class="ce-serif" x="20" y="64" font-size="20" font-weight="300" fill="#F8F0F3">Networking Essentials</text>
    <text class="ce-sans" x="20" y="88" font-size="12" fill="#B6A3AC">Cisco CCNA Track · TCP/IP, Routing &amp; Subnets</text>
  </g>

  <!-- Row 2 -->
  <!-- Cert 4: Modern AI -->
  <g class="ce-card c4" transform="translate(32 170)">
    <rect width="360" height="120" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect class="ce-trace" style="animation-delay:-3s" width="360" height="120" rx="12" fill="none" stroke="url(#ce-trace)" stroke-width="1.2" stroke-linecap="round"/>
    <text class="ce-mono" x="20" y="30" font-size="10" letter-spacing="2.2" fill="#C77B9B">AI · MAY 2026</text>
    <text class="ce-serif" x="20" y="64" font-size="20" font-weight="300" fill="#F8F0F3">Intro to Modern AI</text>
    <text class="ce-sans" x="20" y="88" font-size="12" fill="#B6A3AC">Neural Networks, Transformers &amp; Agentic AI</text>
  </g>

  <!-- Cert 5: Palo Alto Cybersecurity -->
  <g class="ce-card c5" transform="translate(420 170)">
    <rect width="360" height="120" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect class="ce-trace" style="animation-delay:-4s" width="360" height="120" rx="12" fill="none" stroke="url(#ce-trace)" stroke-width="1.2" stroke-linecap="round"/>
    <text class="ce-mono" x="20" y="30" font-size="10" letter-spacing="2.2" fill="#C77B9B">PALO ALTO NETWORKS</text>
    <text class="ce-serif" x="20" y="64" font-size="20" font-weight="300" fill="#F8F0F3">Cybersecurity Academy</text>
    <text class="ce-sans" x="20" y="88" font-size="12" fill="#B6A3AC">Network Defense &amp; Security Architecture</text>
  </g>

  <!-- Cert 6: Linux CLI Infosys -->
  <g class="ce-card c6" transform="translate(808 170)">
    <rect width="360" height="120" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect class="ce-trace" style="animation-delay:-5s" width="360" height="120" rx="12" fill="none" stroke="url(#ce-trace)" stroke-width="1.2" stroke-linecap="round"/>
    <text class="ce-mono" x="20" y="30" font-size="10" letter-spacing="2.2" fill="#C77B9B">INFOSYS SPRINGBOARD</text>
    <text class="ce-serif" x="20" y="64" font-size="20" font-weight="300" fill="#F8F0F3">Linux Command Line</text>
    <text class="ce-sans" x="20" y="88" font-size="12" fill="#B6A3AC">Shell scripting, Process Management &amp; POSIX</text>
  </g>
</svg>
