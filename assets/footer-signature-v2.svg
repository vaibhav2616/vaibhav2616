<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Vaibhav — Building systems that fail safely and scale silently.">
  <defs>
    <linearGradient id="fs-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/><stop offset=".5" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fs-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#E5B5C7"/><stop offset=".5" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .fs-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .fs-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <path d="M40 20 H1160" stroke="url(#fs-line)" stroke-width="1"/>
  <text class="fs-serif" x="600" y="65" font-size="32" font-weight="300" letter-spacing="-.5" fill="#F8F0F3" text-anchor="middle">Vaibhav <tspan font-style="italic" fill="url(#fs-sheen)">Rastogi</tspan></text>
  <text class="fs-mono" x="600" y="94" font-size="11" letter-spacing="2.4" fill="#B6A3AC" text-anchor="middle">BUILDING SYSTEMS THAT FAIL SAFELY AND SCALE SILENTLY</text>
</svg>
