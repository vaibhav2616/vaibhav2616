<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060F1C"/>
      <stop offset="100%" style="stop-color:#0D1F3C"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#7FB3E0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7FB3E0;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7FB3E0;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="440" fill="url(#bgGrad)"/>

  <!-- Circuit grid dots -->
  <g opacity="0.12">
    <circle cx="30" cy="30" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="30" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="30" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="90" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="90" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="90" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="150" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="150" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="150" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="210" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="210" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="210" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="270" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="270" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="270" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="330" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="330" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="330" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="390" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="390" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="390" r="2" fill="#4A90D9"/>
    <!-- Right side dots -->
    <circle cx="750" cy="60" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="60" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="60" r="2" fill="#7FB3E0"/>
    <circle cx="750" cy="120" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="120" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="120" r="2" fill="#7FB3E0"/>
    <circle cx="750" cy="180" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="180" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="180" r="2" fill="#7FB3E0"/>
    <circle cx="750" cy="360" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="360" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="360" r="2" fill="#7FB3E0"/>
    <circle cx="750" cy="420" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="420" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="420" r="2" fill="#7FB3E0"/>
  </g>

  <!-- Circuit lines (left) -->
  <g opacity="0.15" stroke="#4A90D9" stroke-width="1" fill="none">
    <polyline points="30,30 90,30 90,90 150,90"/>
    <polyline points="30,150 90,150 90,210"/>
    <polyline points="150,210 150,270 30,270"/>
    <polyline points="90,330 90,390 30,390"/>
  </g>

  <!-- Circuit lines (right) -->
  <g opacity="0.15" stroke="#7FB3E0" stroke-width="1" fill="none">
    <polyline points="870,60 810,60 810,120 750,120"/>
    <polyline points="870,180 810,180 810,120"/>
    <polyline points="750,360 810,360 810,420 870,420"/>
  </g>

  <!-- Top left accent corner -->
  <rect x="0" y="0" width="4" height="120" fill="#4A90D9" opacity="0.8"/>
  <rect x="0" y="0" width="120" height="4" fill="#4A90D9" opacity="0.8"/>

  <!-- Bottom right accent corner -->
  <rect x="896" y="320" width="4" height="120" fill="#7FB3E0" opacity="0.6"/>
  <rect x="780" y="436" width="120" height="4" fill="#7FB3E0" opacity="0.6"/>

  <!-- Glowing orb background element -->
  <circle cx="750" cy="220" r="140" fill="#4A90D9" opacity="0.04"/>
  <circle cx="750" cy="220" r="90" fill="#4A90D9" opacity="0.05"/>

  <!-- Tag line top -->
  <text x="200" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4A90D9" letter-spacing="3" opacity="0.9">BACKEND ENGINEER  ·  AI SYSTEMS BUILDER</text>

  <!-- Main Name -->
  <text x="200" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" fill="#E8F4FD" letter-spacing="-1">Vaibhav</text>
  <text x="200" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" fill="#7FB3E0" letter-spacing="-1">Rastogi</text>

  <!-- Divider line -->
  <rect x="200" y="258" width="380" height="2" fill="url(#lineGrad)" rx="1"/>

  <!-- Role line -->
  <text x="200" y="296" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8BA8C4" letter-spacing="0.5">B.Tech IT  ·  KIET Group of Institutions, AKTU  ·  CGPA 8.3</text>

  <!-- Tagline -->
  <text x="200" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#E8F4FD" font-style="italic" opacity="0.85">Building distributed systems that fail safely</text>
  <text x="200" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#E8F4FD" font-style="italic" opacity="0.85">and scale silently.</text>

  <!-- Location -->
  <text x="200" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4A90D9" opacity="0.7">📍 Ghaziabad, Uttar Pradesh  ·  India</text>

  <!-- Decorative bracket right side -->
  <text x="680" y="180" font-family="'Courier New', monospace" font-size="130" fill="#4A90D9" opacity="0.06" font-weight="700">{}</text>
</svg>

