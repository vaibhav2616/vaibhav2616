  <text x="44" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8BA8C4">Secure payment microservice using Django ORM for ACID-compliant transaction state management and data integrity.</text>
  <text x="44" y="123" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8BA8C4">Integrated with a central Kafka event bus to broadcast structured transaction telemetry, latency metrics, and failure logs in real-time.</text>
  <text x="44" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8BA8C4">Heavy financial logic isolated in Django; I/O-bound webhooks and client polling offloaded to FastAPI gateway network.</text>

