<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1F3C"/>
      <stop offset="100%" style="stop-color:#060F1C"/>
    </linearGradient>
  </defs>
  <rect width="900" height="250" fill="#060F1C"/>
  <rect x="20" y="10" width="860" height="230" rx="10" fill="url(#projGrad)" stroke="#1A2E4A" stroke-width="1"/>
  <!-- Top accent bar full width -->
  <rect x="20" y="10" width="860" height="3" rx="2" fill="#4A90D9"/>

  <!-- Project number badge -->
  <rect x="44" y="30" width="60" height="22" rx="11" fill="#0A1628" stroke="#4A90D9" stroke-width="1"/>
  <text x="74" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4A90D9" text-anchor="middle" font-weight="600">PROJECT 01</text>

  <!-- Timeline -->
  <text x="840" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4A90D9" text-anchor="end" opacity="0.8">Aug 2026 – Sep 2026</text>

  <!-- Project title -->
  <text x="44" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#E8F4FD">AI-Driven SRE &amp; Automated Triage System</text>

  <!-- Description line 1 -->
  <text x="44" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8BA8C4">Autonomous Site Reliability Engineering pipeline consuming streaming error logs from a payment processing engine via Kafka.</text>
  <text x="44" y="123" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8BA8C4">Multi-agent AI workflows (CrewAI) analyze unstructured logs, identify anomalous transaction drop-offs, and categorize failures.</text>
  <text x="44" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8BA8C4">MCP integration auto-generates, assigns, and tracks Jira bug tickets — completely eliminating manual developer triage.</text>

  <!-- Divider -->
  <rect x="44" y="156" width="812" height="1" fill="#1A2E4A"/>

  <!-- Tech stack pills -->
  <rect x="44" y="166" width="60" height="22" rx="11" fill="#0A1628" stroke="#4A90D9" stroke-width="1"/>
  <text x="74" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7FB3E0" text-anchor="middle">Python</text>

  <rect x="116" y="166" width="60" height="22" rx="11" fill="#0A1628" stroke="#4A90D9" stroke-width="1"/>
  <text x="146" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7FB3E0" text-anchor="middle">CrewAI</text>

  <rect x="188" y="166" width="55" height="22" rx="11" fill="#0A1628" stroke="#4A90D9" stroke-width="1"/>
  <text x="215" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7FB3E0" text-anchor="middle">Kafka</text>

  <rect x="255" y="166" width="70" height="22" rx="11" fill="#0A1628" stroke="#4A90D9" stroke-width="1"/>
  <text x="290" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7FB3E0" text-anchor="middle">Jira MCP</text>

  <rect x="337" y="166" width="60" height="22" rx="11" fill="#0A1628" stroke="#4A90D9" stroke-width="1"/>
  <text x="367" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7FB3E0" text-anchor="middle">Docker</text>

  <!-- Key metric -->
  <rect x="640" y="162" width="220" height="30" rx="6" fill="#0A1628"/>
  <text x="750" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4A90D9" text-anchor="middle" font-weight="600">🎯 Zero manual developer triage</text>

  <!-- Bottom feature tags -->
  <text x="44" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4A90D9" opacity="0.7">✦ Multi-agent orchestration  ✦ Event-driven log analysis  ✦ Automated ticket lifecycle via MCP  ✦ Real-time telemetry processing</text>
</svg>

