<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">Enterprise Microservice Infra Chassis</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p3-glow" cx="80%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p3-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p3-in { animation: p3-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p3-d1 { animation-delay: .15s; } .p3-d2 { animation-delay: .4s; }
    .p3-chip { animation: p3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p3-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p3-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p3-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p3-draw { to { stroke-dashoffset: 0; } }
    .p3-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p3-trace 7s linear infinite; }
    @keyframes p3-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .p3-in, .p3-chip { animation: none; }
      .p3-draw { animation: none; stroke-dashoffset: 0; }
      .p3-trace { display: none; }
    }
  </style>
  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="700" width="500" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    <rect class="p3-trace" width="1200" height="370" rx="18" fill="none" stroke="url(#p3-trace)" stroke-width="1.6"/>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".18"/>

    <!-- Left Column: Info & Metrics -->
    <g class="p3-in p3-d1">
      <text class="p3-mono" x="56" y="60" font-size="12" letter-spacing="2.6" fill="#C77B9B">03 · MICROSERVICES · INFRASTRUCTURE · MAY–JUN 2026</text>
      <text class="p3-serif" x="54" y="118" font-size="46" font-weight="300" letter-spacing="-1.2" fill="#F8F0F3">Microservice Infra Chassis</text>
      <text class="p3-sans" x="56" y="156" font-size="16.5" fill="#B6A3AC">Clean Architecture template with Transactional Outbox, Redis idempotency locking &amp; RFC 7807.</text>
      <text class="p3-mono" x="56" y="190" font-size="12" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> FastAPI chassis + SQLAlchemy ORM + CDC Outbox polling engine + standardized RFC 7807 problem details</text>
      
      <line class="p3-draw" x1="56" y1="216" x2="680" y2="216" stroke="#C77B9B" stroke-opacity=".3"/>

      <!-- Metrics -->
      <g transform="translate(56 256)">
        <text class="p3-serif" font-size="32" font-weight="300" fill="#F8F0F3">RFC 7807</text>
        <text class="p3-sans" y="24" font-size="12" fill="#B6A3AC">standardized error contracts</text>
      </g>
      <g transform="translate(240 256)">
        <text class="p3-serif" font-size="32" font-weight="300" fill="#F8F0F3">100%</text>
        <text class="p3-sans" y="24" font-size="12" fill="#B6A3AC">at-least-once message delivery</text>
      </g>
      <g transform="translate(440 256)">
        <text class="p3-serif" font-size="32" font-weight="300" fill="#F8F0F3">&lt; 2 min</text>
        <text class="p3-sans" y="24" font-size="12" fill="#B6A3AC">new service bootstrapping time</text>
      </g>

      <!-- Chips -->
      <g class="p3-chip" style="animation-delay:.90s"><rect x="56" y="306" width="68" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="90" y="323" text-anchor="middle" font-size="11.5" fill="#E5B5C7">FastAPI</text></g>
      <g class="p3-chip" style="animation-delay:1.02s"><rect x="132" y="306" width="94" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="179" y="323" text-anchor="middle" font-size="11.5" fill="#E5B5C7">SQLAlchemy</text></g>
      <g class="p3-chip" style="animation-delay:1.14s"><rect x="234" y="306" width="66" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="267" y="323" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Redis</text></g>
      <g class="p3-chip" style="animation-delay:1.26s"><rect x="308" y="306" width="66" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="341" y="323" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Kafka</text></g>
      <g class="p3-chip" style="animation-delay:1.38s"><rect x="382" y="306" width="68" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p3-mono" x="416" y="323" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Docker</text></g>
    </g>

    <!-- Right Column: Outbox Architecture Diagram -->
    <g class="p3-in p3-d2" transform="translate(740 40)">
      <text x="20" y="24" class="p3-mono" font-size="10.5" letter-spacing="2.4" fill="#B6A3AC">GATEWAY → ATOMIC OUTBOX → KAFKA CDC</text>

      <!-- Box 1: FastAPI Request -->
      <g transform="translate(20 54)">
        <rect width="116" height="64" rx="10" fill="#27101C" stroke="#C77B9B" stroke-opacity=".4"/>
        <text class="p3-mono" x="58" y="28" font-size="10" fill="#C77B9B" text-anchor="middle">GATEWAY</text>
        <text class="p3-sans" x="58" y="48" font-size="13" font-weight="600" fill="#F8F0F3" text-anchor="middle">FastAPI</text>
      </g>

      <!-- Arrow 1 -->
      <path class="p3-draw" d="M136 86 H176" fill="none" stroke="#E5B5C7" stroke-width="1.5"/>

      <!-- Box 2: Outbox Table (Atomic) -->
      <g transform="translate(176 40)">
        <rect width="130" height="92" rx="12" fill="#451126" stroke="#E5B5C7" stroke-width="1.2"/>
        <text class="p3-mono" x="65" y="26" font-size="9.5" letter-spacing="1.5" fill="#E5B5C7" text-anchor="middle">TRANSACTIONAL</text>
        <text class="p3-sans" x="65" y="48" font-size="13" font-weight="600" fill="#F8F0F3" text-anchor="middle">Domain Model</text>
        <text class="p3-sans" x="65" y="66" font-size="13" font-weight="600" fill="#F8F0F3" text-anchor="middle">Outbox Event</text>
        <text class="p3-mono" x="65" y="82" font-size="9" fill="#B6A3AC" text-anchor="middle">ATOMIC COMMIT</text>
      </g>

      <!-- Arrow 2 -->
      <path class="p3-draw" d="M306 86 H346" fill="none" stroke="#E5B5C7" stroke-width="1.5"/>

      <!-- Box 3: Kafka CDC Broker -->
      <g transform="translate(346 54)">
        <rect width="110" height="64" rx="10" fill="#27101C" stroke="#C77B9B" stroke-opacity=".4"/>
        <text class="p3-mono" x="55" y="28" font-size="10" fill="#C77B9B" text-anchor="middle">BROKER</text>
        <text class="p3-sans" x="55" y="48" font-size="13" font-weight="600" fill="#F8F0F3" text-anchor="middle">Kafka Bus</text>
      </g>

      <!-- Feedback / Telemetry Branch -->
      <path d="M401 118 V180 H241 V132" fill="none" stroke="#C77B9B" stroke-opacity=".35" stroke-dasharray="4 6"/>
      <rect x="290" y="168" width="100" height="24" rx="6" fill="#1C0C15" stroke="#C77B9B" stroke-opacity=".2"/>
      <text class="p3-mono" x="340" y="184" font-size="9.5" fill="#E5B5C7" text-anchor="middle">Events Flushed</text>
    </g>
  </g>
</svg>
