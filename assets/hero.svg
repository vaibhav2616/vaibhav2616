<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Vaibhav Rastogi — Backend Engineer &amp; AI Systems Builder</title>
  <desc id="hero-desc">Building distributed systems that fail safely and scale silently.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060F1C"/>
      <stop offset="100%" stop-color="#0D1F3C"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4A90D9" stop-opacity="1"/>
      <stop offset="70%" stop-color="#7FB3E0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7FB3E0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameSheen" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="40%" stop-color="#E8F4FD"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E8F4FD"/>
      <stop offset="100%" stop-color="#E8F4FD"/>
    </linearGradient>
    <linearGradient id="nameSheenAnim" x1="-100%" y1="0%" x2="0%" y2="0%" gradientUnits="userSpaceOnUse">
      <animateTransform attributeName="gradientTransform" type="translate" values="-900 0;900 0;900 0" dur="4s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;0 0 1 1"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="svgClip">
      <rect width="900" height="440"/>
    </clipPath>
  </defs>

  <style>
    .d1 { animation: hero-rise 0.8s cubic-bezier(.16,1,.3,1) 0.1s both; }
    .d2 { animation: hero-rise 0.8s cubic-bezier(.16,1,.3,1) 0.3s both; }
    .d3 { animation: hero-rise 0.8s cubic-bezier(.16,1,.3,1) 0.5s both; }
    .d4 { animation: hero-rise 0.8s cubic-bezier(.16,1,.3,1) 0.7s both; }
    .d5 { animation: hero-rise 0.8s cubic-bezier(.16,1,.3,1) 0.9s both; }
    .d6 { animation: hero-rise 0.8s cubic-bezier(.16,1,.3,1) 1.1s both; }
    .hero-draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.4s cubic-bezier(.65,0,.35,1) 0.3s forwards; }
    @keyframes hero-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes hero-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .d1,.d2,.d3,.d4,.d5,.d6 { animation: none; }
      .hero-draw { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="440" fill="url(#bgGrad)"/>

  <!-- Floating orbs (animated) -->
  <ellipse cx="750" cy="180" rx="160" ry="100" fill="#4A90D9" opacity="0.03">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 25;0 0" dur="22s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </ellipse>
  <ellipse cx="820" cy="300" rx="100" ry="60" fill="#7FB3E0" opacity="0.04">
    <animateTransform attributeName="transform" type="translate" values="0 0;30 -20;0 0" dur="28s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </ellipse>

  <!-- Scan line (animated) -->
  <rect clip-path="url(#svgClip)" x="0" width="900" height="1.5" fill="#4A90D9" opacity="0.18">
    <animate attributeName="y" values="-2;442;-2" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.85;1" keySplines=".42 0 .58 1;0 0 1 1"/>
    <animate attributeName="opacity" values="0;0.18;0.18;0" keyTimes="0;0.05;0.9;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Drifting particles -->
  <g clip-path="url(#svgClip)" opacity="0.5">
    <circle cx="80" cy="60" r="1.5" fill="#4A90D9">
      <animate attributeName="cy" values="60;400;60" dur="14s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.9;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="350" r="1.2" fill="#7FB3E0">
      <animate attributeName="cy" values="350;50;350" dur="18s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.9;1" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="400" r="1" fill="#4A90D9">
      <animate attributeName="cy" values="400;20;400" dur="22s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.1;0.9;1" dur="22s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Circuit grid dots (static) -->
  <g opacity="0.12">
    <circle cx="30" cy="30" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="30" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="30" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="90" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="90" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="90" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="150" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="150" r="2" fill="#4A90D9"/>
    <circle cx="150" cy="150" r="2" fill="#4A90D9"/>
    <circle cx="30" cy="270" r="2" fill="#4A90D9"/>
    <circle cx="90" cy="270" r="2" fill="#4A90D9"/>
    <circle cx="750" cy="60" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="60" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="60" r="2" fill="#7FB3E0"/>
    <circle cx="750" cy="360" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="360" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="360" r="2" fill="#7FB3E0"/>
    <circle cx="750" cy="420" r="2" fill="#7FB3E0"/>
    <circle cx="810" cy="420" r="2" fill="#7FB3E0"/>
    <circle cx="870" cy="420" r="2" fill="#7FB3E0"/>
  </g>

  <!-- Draw-on accent lines (animated) -->
  <g fill="none">
    <polyline class="hero-draw" points="30,30 90,30 90,90 150,90" stroke="#4A90D9" stroke-width="1" opacity="0.18"/>
    <polyline class="hero-draw" points="30,150 90,150 90,210" stroke="#4A90D9" stroke-width="1" opacity="0.15"/>
    <polyline class="hero-draw" points="870,60 810,60 810,120 750,120" stroke="#7FB3E0" stroke-width="1" opacity="0.18"/>
    <polyline class="hero-draw" points="870,360 810,360 810,420 750,420" stroke="#7FB3E0" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Top-left accent corner -->
  <rect class="d1" x="0" y="0" width="4" height="120" fill="#4A90D9" opacity="0.8"/>
  <rect class="d1" x="0" y="0" width="120" height="4" fill="#4A90D9" opacity="0.8"/>

  <!-- Bottom-right accent corner -->
  <rect class="d1" x="896" y="320" width="4" height="120" fill="#7FB3E0" opacity="0.6"/>
  <rect class="d1" x="780" y="436" width="120" height="4" fill="#7FB3E0" opacity="0.6"/>

  <!-- Tagline top -->
  <text class="d2" x="200" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4A90D9" letter-spacing="3" opacity="0.9">BACKEND ENGINEER  ·  AI SYSTEMS BUILDER</text>

  <!-- Main Name with sheen animation -->
  <text class="d3" x="200" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" fill="#E8F4FD" letter-spacing="-1">
    Vaibhav
    <animate attributeName="fill" values="#E8F4FD;#FFFFFF;#E8F4FD" dur="4s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </text>
  <text class="d4" x="200" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" fill="#7FB3E0" letter-spacing="-1">Rastogi</text>

  <!-- Divider line -->
  <rect class="d4" x="200" y="258" width="380" height="2" fill="url(#lineGrad)" rx="1"/>

  <!-- Role line -->
  <text class="d5" x="200" y="296" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8BA8C4" letter-spacing="0.5">B.Tech IT  ·  KIET Group of Institutions, AKTU  ·  CGPA 8.3</text>

  <!-- Tagline -->
  <text class="d5" x="200" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#E8F4FD" font-style="italic" opacity="0.85">Building distributed systems that fail safely</text>
  <text class="d6" x="200" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#E8F4FD" font-style="italic" opacity="0.85">and scale silently.</text>

  <!-- Blinking cursor after tagline -->
  <rect class="d6" x="200" y="370" width="8" height="2" fill="#4A90D9" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.8;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Location -->
  <text class="d6" x="200" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4A90D9" opacity="0.7">📍 Ghaziabad, Uttar Pradesh  ·  India</text>

  <!-- Decorative bracket right side -->
  <text x="680" y="180" font-family="'Courier New', monospace" font-size="130" fill="#4A90D9" opacity="0.05" font-weight="700">{}</text>
</svg>
