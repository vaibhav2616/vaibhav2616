<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="06 Certifications: Industry credentials, verified.">
  <defs>
    <linearGradient id="tce-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#4d9fff"/><stop offset=".6" stop-color="#247bff"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tce-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#f2f5ff"/><stop offset="1" stop-color="#00e5ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="tce-pulse"><stop offset="0" stop-color="#f2f5ff"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".6"/><stop offset="1" stop-color="#4d9fff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tce-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tce-in { animation: tce-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tce-d2 { animation-delay: .2s; } .tce-d3 { animation-delay: .45s; }
    .tce-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tce-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tce-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tce-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tce-in { animation: none; } .tce-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="tce-in">
    <text class="tce-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#4d9fff"><tspan fill="#00e5ff">06</tspan>   CERTIFICATIONS</text>
  </g>
  <g class="tce-in tce-d2">
    <text class="tce-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#f2f5ff">Industry credentials, <tspan font-style="italic" fill="url(#tce-sheen)">verified.</tspan></text>
  </g>
  <g class="tce-in tce-d3">
    <text class="tce-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#8e9db9">AWS · CISCO · PALO ALTO · INFOSYS</text>
  </g>
  <path class="tce-draw" d="M40 106 H1160" stroke="url(#tce-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#tce-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
