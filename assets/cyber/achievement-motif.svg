<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="ach-title ach-desc">
  <title id="ach-title">Recognition &amp; Milestones</title>
  <desc id="ach-desc">Patent Filed with Indian Patent Office for Saarthi AR/VR Platform. GATE 2026 Computer Science. CGPA 8.30 in B.Tech Information Technology at KIET. 2,438 GitHub contributions. 500+ DSA problems solved. 1,000+ production orders automated at OrganicSabziwala.</desc>

  <defs>
    <linearGradient id="ach-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <radialGradient id="ach-glow-a" cx="85%" cy="0%" r="90%">
      <stop offset="0" stop-color="#247bff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#1e3554" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ach-glow-b" cx="90%" cy="0%" r="90%">
      <stop offset="0" stop-color="#4d9fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1e3554" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ach-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d7a" stop-opacity="0"/>
      <stop offset=".4" stop-color="#ff2d7a"/>
      <stop offset=".6" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ach-outline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ach-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f2f5ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#f2f5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ach-clip-a"><rect x="0" y="0" width="700" height="250" rx="16"/></clipPath>
    <clipPath id="ach-clip-b"><rect x="0" y="0" width="476" height="250" rx="16"/></clipPath>
    <linearGradient id="ach-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f5ff"/><stop offset=".45" stop-color="#00e5ff"/><stop offset="1" stop-color="#4d9fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ach-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ach-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ach-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ach-in    { animation: ach-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .35s; } .a3 { animation-delay: .6s; }
    .ach-draw  { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: ach-draw 2.6s cubic-bezier(.65,0,.35,1) .8s forwards; }
    @keyframes ach-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ach-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ach-in { animation: none; }
      .ach-draw { animation: none; stroke-dashoffset: 0; }
    }
    .ach-trace-a { stroke-dasharray: 340 1900; stroke-dashoffset: 2240; animation: ach-trace-a 6s linear infinite; }
    .ach-trace-b { stroke-dasharray: 260 1452; stroke-dashoffset: 1712; animation: ach-trace-b 6s linear -3s infinite; }
    @keyframes ach-trace-a { to { stroke-dashoffset: 0; } }
    @keyframes ach-trace-b { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ach-trace-a, .ach-trace-b { display: none; } }
  </style>

  <rect width="1200" height="430" rx="20" fill="url(#ach-bg)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="19.5" fill="none" stroke="#4d9fff" stroke-opacity=".16"/>

  <!-- Patent Filed — Hero Card (700px wide) -->
  <g class="ach-in a1"><g transform="translate(24 24)">
    <g clip-path="url(#ach-clip-a)">
      <rect width="700" height="250" fill="#070b16"/>
      <rect width="700" height="250" fill="url(#ach-glow-a)"/>
      <text class="ach-serif" x="684" y="132" text-anchor="end" font-size="110" font-weight="300" letter-spacing="-4" fill="url(#ach-outline)">PATENT</text>
      <rect x="-300" y="0" width="260" height="250" fill="url(#ach-sheen)" transform="skewX(-18)">
        <animate attributeName="x" values="-300;900;900" keyTimes="0;.35;1" dur="9s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="#4d9fff" stroke-opacity=".38"/>
    <rect class="ach-trace-a" x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="40" y="0" width="300" height="1" fill="url(#ach-hair)"/>
    <text class="ach-mono" x="36" y="154" font-size="12" letter-spacing="2.6" fill="#4d9fff">INTELLECTUAL PROPERTY · GOVT OF INDIA</text>
    <text class="ach-serif" x="34" y="204" font-size="46" font-weight="300" letter-spacing="-1" fill="#f2f5ff">Patent Filed</text>
    <text class="ach-sans" x="36" y="230" font-size="14" fill="#8e9db9">Saarthi — Assistive AR/VR Cultural Heritage Preservation Platform</text>
  </g></g>

  <!-- GATE 2026 Examination — Right Card (476px wide) -->
  <g class="ach-in a2"><g transform="translate(700 24)">
    <g transform="translate(24 0)">
      <g clip-path="url(#ach-clip-b)">
        <rect width="476" height="250" fill="#070b16"/>
        <rect width="476" height="250" fill="url(#ach-glow-b)"/>
        <text class="ach-serif" x="490" y="132" text-anchor="end" font-size="140" font-style="italic" font-weight="300" letter-spacing="-6" fill="none" stroke="#00e5ff" stroke-opacity=".25">GATE</text>
      </g>
      <rect x=".5" y=".5" width="475" height="249" rx="15.5" fill="none" stroke="#4d9fff" stroke-opacity=".3"/>
      <rect class="ach-trace-b" x=".5" y=".5" width="475" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="40" y="0" width="220" height="1" fill="url(#ach-hair)"/>
      <text class="ach-mono" x="32" y="154" font-size="12" letter-spacing="2.6" fill="#4d9fff">NATIONAL COMPETITIVE EXAMINATION</text>
      <text class="ach-serif" x="30" y="204" font-size="46" font-weight="300" letter-spacing="-1" fill="#f2f5ff">GATE 2026</text>
      <text class="ach-sans" x="32" y="230" font-size="14" fill="#8e9db9">Computer Science &amp; Information Technology</text>
    </g>
  </g></g>

  <!-- Animated connector across the score strip -->
  <path class="ach-draw" d="M24 300 H1176" stroke="#4d9fff" stroke-opacity=".35"/>

  <!-- Score strip with 5 verified metrics -->
  <g class="ach-in a3 ach-sans" font-size="13" fill="#8e9db9">
    <g transform="translate(36 300)">
      <circle cx="0" cy="0" r="3.5" fill="#00e5ff"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#4d9fff">ACADEMICS</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#f2f5ff">8.30</text>
      <text y="102">CGPA · B.Tech IT KIET</text>
    </g>
    <g transform="translate(266 300)">
      <circle cx="0" cy="0" r="3.5" fill="#00e5ff"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#4d9fff">CONTRIBUTIONS</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#f2f5ff">2,438</text>
      <text y="102">commits &amp; pull requests</text>
    </g>
    <g transform="translate(496 300)">
      <circle cx="0" cy="0" r="3.5" fill="#00e5ff"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#4d9fff">DSA PRACTICE</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#f2f5ff">500+</text>
      <text y="102">LeetCode &amp; GfG solved</text>
    </g>
    <g transform="translate(726 300)">
      <circle cx="0" cy="0" r="3.5" fill="#00e5ff"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#4d9fff">PRODUCTION</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#f2f5ff">1,000+</text>
      <text y="102">orders @ OrganicSabziwala</text>
    </g>
    <g transform="translate(956 300)">
      <circle cx="0" cy="0" r="3.5" fill="#00e5ff"/>
      <text class="ach-mono" y="34" font-size="11" letter-spacing="2" fill="#4d9fff">SYSTEM DESIGN</text>
      <text class="ach-serif" y="78" font-size="40" font-weight="300" fill="#f2f5ff">5+</text>
      <text y="102">distributed microservices</text>
    </g>
  </g>

  <g class="ug-chevrons" opacity="0.9">
    <path d="M1090 28l9 0 -7 18h-9Z" fill="#ff354f"/>
    <path d="M1102 28l9 0 -7 18h-9Z" fill="#ff354f"/>
    <path d="M1114 28l9 0 -7 18h-9Z" fill="#ff354f"/>
  </g>
</svg>
