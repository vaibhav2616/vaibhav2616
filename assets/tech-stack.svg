<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Tech stack</title>
  <desc id="tc-desc">Languages: Python (primary), C, C++, C#, SQL, JavaScript. Backend: FastAPI, Django, REST APIs, SQLAlchemy, JWT. Messaging &amp; Cache: Kafka, Redis. Databases: PostgreSQL. DevOps: Docker, AWS. AI/ML: CrewAI, Gemini API, NLP, OCR, CNNs. AR/VR: Unity, Unreal Engine, Blender. Tools: Git, GitHub, Postman.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060F1C"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1A3A6B" stop-opacity=".7"/>
      <stop offset="1" stop-color="#1A3A6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tc-pulse">
      <stop offset="0" stop-color="#E8F4FD"/>
      <stop offset=".5" stop-color="#7FB3E0" stop-opacity=".6"/>
      <stop offset="1" stop-color="#4A90D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F4FD"/>
      <stop offset=".45" stop-color="#7FB3E0"/>
      <stop offset="1" stop-color="#4A90D9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .tc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tc-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tc-panel { animation: tc-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tc-p1 { animation-delay: .05s; } .tc-p2 { animation-delay: .2s; } .tc-p3 { animation-delay: .35s; }
    .tc-p4 { animation-delay: .5s; } .tc-p5 { animation-delay: .65s; } .tc-p6 { animation-delay: .8s; }
    .tc-web { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: tc-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes tc-in  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes tc-draw { to { stroke-dashoffset: 0; } }
    .tc-trace { stroke-dasharray: 201 1120; stroke-dashoffset: 1321; animation: tc-trace 7s linear infinite; }
    @keyframes tc-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .tc-panel { animation: none; }
      .tc-web   { animation: none; stroke-dashoffset: 0; }
      .tc-trace { display: none; }
    }
  </style>

  <rect width="900" height="500" rx="16" fill="url(#tc-bg)"/>
  <rect width="900" height="500" rx="16" fill="url(#tc-glow)"/>
  <rect x=".5" y=".5" width="899" height="499" rx="15.5" fill="none" stroke="#4A90D9" stroke-opacity=".12"/>

  <!-- Constellation gutters -->
  <path class="tc-web" d="M20 250 H880 M300 20 V480 M600 20 V480" fill="none" stroke="#4A90D9" stroke-opacity=".18"/>

  <!-- Travelling dot along horizontal gutter -->
  <circle cx="0" cy="250" r="6" fill="url(#tc-pulse)" opacity="0">
    <animate attributeName="cx" values="20;880" dur="9s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Junction diamonds -->
  <g fill="#060F1C" stroke="#7FB3E0">
    <rect x="294" y="244" width="12" height="12" transform="rotate(45 300 250)"/>
    <rect x="594" y="244" width="12" height="12" transform="rotate(45 600 250)"/>
  </g>

  <!-- Row 1 -->
  <g class="tc-panel tc-p1"><g transform="translate(24 24)">
    <rect width="262" height="210" rx="12" fill="#060F1C" fill-opacity=".9" stroke="#4A90D9" stroke-opacity=".2"/>
    <rect class="tc-trace" style="animation-delay:0s" width="262" height="210" rx="12" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="20" y="36" font-size="10" letter-spacing="2.2" fill="#4A90D9">01  LANGUAGES</text>
    <text class="tc-serif" x="20" y="88" font-size="38" font-weight="300" fill="#E8F4FD">Python <tspan font-size="11" class="tc-mono" fill="#4A90D9" dy="-16">PRIMARY</tspan></text>
    <text class="tc-serif" x="20" y="134" font-size="28" font-weight="300" fill="#E8F4FD">C  ·  C++  ·  C#</text>
    <text class="tc-serif" x="20" y="170" font-size="22" font-weight="300" fill="#8BA8C4">SQL  ·  JavaScript</text>
  </g></g>

  <g class="tc-panel tc-p2"><g transform="translate(310 24)">
    <rect width="276" height="210" rx="12" fill="#060F1C" fill-opacity=".9" stroke="#4A90D9" stroke-opacity=".2"/>
    <rect class="tc-trace" style="animation-delay:-1.15s" width="276" height="210" rx="12" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="20" y="36" font-size="10" letter-spacing="2.2" fill="#4A90D9">02  AI / ML</text>
    <text class="tc-serif" x="20" y="86" font-size="28" font-weight="300" fill="#E8F4FD">CrewAI · Gemini API</text>
    <text class="tc-serif" x="20" y="120" font-size="22" font-weight="300" fill="#E8F4FD">NLP · OCR · CNNs</text>
    <text class="tc-serif" x="20" y="154" font-size="18" font-weight="300" fill="#8BA8C4">MCP · Agentic Pipelines</text>
    <text class="tc-mono" x="20" y="186" font-size="9" letter-spacing="1.4" fill="#8BA8C4">AWS CERTIFIED AI PRACTITIONER</text>
  </g></g>

  <g class="tc-panel tc-p3"><g transform="translate(610 24)">
    <rect width="266" height="210" rx="12" fill="#060F1C" fill-opacity=".9" stroke="#4A90D9" stroke-opacity=".2"/>
    <rect class="tc-trace" style="animation-delay:-2.3s" width="266" height="210" rx="12" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="20" y="36" font-size="10" letter-spacing="2.2" fill="#4A90D9">03  AR / VR</text>
    <text class="tc-serif" x="20" y="88" font-size="34" font-weight="300" fill="#E8F4FD">Unity</text>
    <text class="tc-serif" x="20" y="126" font-size="26" font-weight="300" fill="#E8F4FD">Unreal Engine</text>
    <text class="tc-serif" x="20" y="162" font-size="22" font-weight="300" fill="#8BA8C4">Blender</text>
    <text class="tc-mono" x="20" y="186" font-size="9" letter-spacing="1.4" fill="#8BA8C4">GDG AR/VR MENTOR · PATENT FILED</text>
  </g></g>

  <!-- Row 2 -->
  <g class="tc-panel tc-p4"><g transform="translate(24 258)">
    <rect width="262" height="218" rx="12" fill="#060F1C" fill-opacity=".9" stroke="#4A90D9" stroke-opacity=".2"/>
    <rect class="tc-trace" style="animation-delay:-3.45s" width="262" height="218" rx="12" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="20" y="36" font-size="10" letter-spacing="2.2" fill="#4A90D9">04  BACKEND</text>
    <text class="tc-serif" x="20" y="82" font-size="28" font-weight="300" fill="#E8F4FD">FastAPI  ·  Django</text>
    <text class="tc-serif" x="20" y="118" font-size="22" font-weight="300" fill="#E8F4FD">REST APIs  ·  SQLAlchemy</text>
    <text class="tc-serif" x="20" y="152" font-size="20" font-weight="300" fill="#8BA8C4">JWT  ·  Clean Architecture</text>
    <text class="tc-serif" x="20" y="184" font-size="18" font-weight="300" fill="#8BA8C4">Outbox  ·  RFC 7807</text>
  </g></g>

  <g class="tc-panel tc-p5"><g transform="translate(310 258)">
    <rect width="276" height="218" rx="12" fill="#060F1C" fill-opacity=".9" stroke="#4A90D9" stroke-opacity=".2"/>
    <rect class="tc-trace" style="animation-delay:-4.6s" width="276" height="218" rx="12" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="20" y="36" font-size="10" letter-spacing="2.2" fill="#4A90D9">05  DATA &amp; INFRA</text>
    <text class="tc-serif" x="20" y="82" font-size="28" font-weight="300" fill="#E8F4FD">PostgreSQL</text>
    <text class="tc-serif" x="20" y="116" font-size="24" font-weight="300" fill="#E8F4FD">Kafka  ·  Redis</text>
    <text class="tc-serif" x="20" y="150" font-size="22" font-weight="300" fill="#E8F4FD">Docker  ·  AWS</text>
    <text class="tc-mono" x="20" y="180" font-size="9" letter-spacing="1.4" fill="#8BA8C4">INDEXING · SHARDING · ACID</text>
  </g></g>

  <g class="tc-panel tc-p6"><g transform="translate(610 258)">
    <rect width="266" height="218" rx="12" fill="#060F1C" fill-opacity=".9" stroke="#4A90D9" stroke-opacity=".2"/>
    <rect class="tc-trace" style="animation-delay:-5.75s" width="266" height="218" rx="12" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="20" y="36" font-size="10" letter-spacing="2.2" fill="#4A90D9">06  TOOLS &amp; CS CORE</text>
    <text class="tc-serif" x="20" y="82" font-size="24" font-weight="300" fill="#E8F4FD">Git  ·  GitHub  ·  Postman</text>
    <text class="tc-serif" x="20" y="116" font-size="20" font-weight="300" fill="#E8F4FD">DSA · OS · CN · DBMS · OOP</text>
    <text class="tc-serif" x="20" y="150" font-size="18" font-weight="300" fill="#8BA8C4">Multithreading · System Design</text>
    <text class="tc-serif" x="20" y="180" font-size="16" font-weight="300" fill="#8BA8C4">HLD · LLD · Microservices</text>
  </g></g>
</svg>
