<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-title ab-desc">
  <title id="ab-title">About Vaibhav Rastogi</title>
  <desc id="ab-desc">B.Tech IT at KIET Group of Institutions, AKTU, CGPA 8.3. Backend Systems Intern at OrganicSabziwala. Building distributed systems, AI-agent pipelines, and production-grade microservice infra. Primary language Python. Stack: FastAPI, Django, Kafka, Redis, Docker.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="ab-glow" cx="85%" cy="30%" r="65%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".6"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ab-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ab-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ab-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    /* Typewriter reveal per line */
    .ab-l1 { animation: ab-type 0.6s steps(1,end) 0.3s both; }
    .ab-l2 { animation: ab-type 0.6s steps(1,end) 0.9s both; }
    .ab-l3 { animation: ab-type 0.6s steps(1,end) 1.5s both; }
    .ab-l4 { animation: ab-type 0.6s steps(1,end) 2.1s both; }
    .ab-l5 { animation: ab-type 0.6s steps(1,end) 2.7s both; }
    .ab-l6 { animation: ab-type 0.6s steps(1,end) 3.3s both; }
    .ab-l7 { animation: ab-type 0.6s steps(1,end) 3.9s both; }
    .ab-l8 { animation: ab-type 0.6s steps(1,end) 4.5s both; }

    /* Card slide-in */
    .ab-card { animation: ab-in 1s cubic-bezier(.16,1,.3,1) both; }
    .ab-c1 { animation-delay: .2s; }
    .ab-c2 { animation-delay: .45s; }
    .ab-c3 { animation-delay: .7s; }

    @keyframes ab-type { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ab-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .ab-l1,.ab-l2,.ab-l3,.ab-l4,.ab-l5,.ab-l6,.ab-l7,.ab-l8 { animation: none; }
      .ab-card { animation: none; }
    }
  </style>

  <rect width="1200" height="420" rx="20" fill="url(#ab-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ab-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".18"/>

  <!-- LEFT: Interactive Terminal Window -->
  <g transform="translate(48 32)">
    <rect width="560" height="356" rx="12" fill="#10070C" stroke="#C77B9B" stroke-opacity=".25"/>
    <!-- Title bar -->
    <rect width="560" height="36" rx="12" fill="#1C0C15"/>
    <rect y="24" width="560" height="12" fill="#1C0C15"/>
    <circle cx="24" cy="18" r="5.5" fill="#FF5F56"/>
    <circle cx="44" cy="18" r="5.5" fill="#FFBD2E"/>
    <circle cx="64" cy="18" r="5.5" fill="#27C93F"/>
    <text class="ab-mono" x="280" y="22" font-size="11" fill="#B6A3AC" text-anchor="middle">vaibhav@portfolio: ~</text>

    <!-- Terminal Output -->
    <text class="ab-mono ab-l1" x="28" y="70" font-size="12" fill="#E5B5C7">$ whoami</text>
    <text class="ab-mono ab-l2" x="28" y="94" font-size="12" fill="#F8F0F3">Vaibhav Rastogi — Backend Systems Engineer &amp; AI Architect</text>

    <text class="ab-mono ab-l3" x="28" y="130" font-size="12" fill="#E5B5C7">$ cat education.txt</text>
    <text class="ab-mono ab-l4" x="28" y="154" font-size="12" fill="#F8F0F3">B.Tech IT · KIET Group of Institutions, AKTU · CGPA 8.3</text>
    <text class="ab-mono ab-l5" x="28" y="174" font-size="11" fill="#B6A3AC">2023–2027 · Senior Sec: St. Anthony's School (CBSE 85%)</text>

    <text class="ab-mono ab-l6" x="28" y="210" font-size="12" fill="#E5B5C7">$ cat experience.txt</text>
    <text class="ab-mono ab-l7" x="28" y="234" font-size="12" fill="#F8F0F3">Backend Systems Intern @ OrganicSabziwala (Dec 2025–May 2026)</text>
    <text class="ab-mono ab-l8" x="28" y="254" font-size="11" fill="#B6A3AC">→ Resolved inventory race conditions &amp; redesigned order validation pipeline</text>

    <text class="ab-mono" x="28" y="290" font-size="12" fill="#E5B5C7">$ cat core_tenet.txt</text>
    <text class="ab-mono" x="28" y="312" font-size="12" fill="#F8F0F3">"Building distributed systems that fail safely and scale silently."</text>

    <!-- Blinking cursor -->
    <rect x="28" y="326" width="8" height="15" rx="1" fill="#E5B5C7">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- RIGHT: 3 Architectural Feature Panels -->
  <!-- Panel 1: Primary Language -->
  <g class="ab-card ab-c1" transform="translate(636 32)">
    <rect width="516" height="106" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect width="4" height="106" rx="2" fill="#E5B5C7"/>
    <text class="ab-mono" x="24" y="30" font-size="10" letter-spacing="2.4" fill="#C77B9B">PRIMARY LANGUAGE</text>
    <text class="ab-serif" x="22" y="74" font-size="40" font-weight="300" fill="#F8F0F3">Python <tspan font-size="12" class="ab-mono" fill="#C77B9B" dy="-16">PRIMARY</tspan></text>
    <text class="ab-serif" x="220" y="72" font-size="22" font-weight="300" fill="#B6A3AC">C  ·  C++  ·  C#  ·  SQL</text>
    <text class="ab-mono" x="24" y="94" font-size="10.5" fill="#E5B5C7">HIGH-THROUGHPUT CONCURRENCY · EVENT DRIVEN</text>
  </g>

  <!-- Panel 2: Stack -->
  <g class="ab-card ab-c2" transform="translate(636 156)">
    <rect width="516" height="106" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect width="4" height="106" rx="2" fill="#701A3D"/>
    <text class="ab-mono" x="24" y="30" font-size="10" letter-spacing="2.4" fill="#C77B9B">WHERE SYSTEMS LIVE</text>
    <text class="ab-sans" x="24" y="64" font-size="20" font-weight="500" fill="#F8F0F3">FastAPI  ·  Django  ·  Kafka  ·  Redis</text>
    <text class="ab-sans" x="24" y="90" font-size="14.5" fill="#B6A3AC">Docker  ·  PostgreSQL  ·  AWS (Cloud Practitioner Certified)</text>
  </g>

  <!-- Panel 3: Focus -->
  <g class="ab-card ab-c3" transform="translate(636 280)">
    <rect width="516" height="108" rx="12" fill="#14090F" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect width="4" height="108" rx="2" fill="#A12556"/>
    <text class="ab-mono" x="24" y="30" font-size="10" letter-spacing="2.4" fill="#C77B9B">DRAWN TO</text>
    <text class="ab-sans" x="24" y="62" font-size="15" fill="#F8F0F3">⚡ Distributed Systems &amp; Outbox Reliability</text>
    <text class="ab-sans" x="24" y="86" font-size="15" fill="#F8F0F3">🤖 Multi-Agent Systems (CrewAI/MCP)  ·  🥽 AR/VR (GDG Mentor)</text>
  </g>
</svg>
