    <g class="stat-row" transform="translate(0, 76)" style="animation-delay: 0.2s">
      <path class="icon" d="M 4 2 L 4 7 C 4 8.1 3.1 9 2 9 C 0.9 9 0 8.1 0 7 L 0 2 C -0.89 1.6 -1.5 0.7 -1.5 -0.3 C -1.5 -1.7 -0.4 -2.8 1 -2.8 C 2.4 -2.8 3.5 -1.7 3.5 -0.3 C 3.5 0.7 2.89 1.6 2 2 L 2 5 L 4 5 L 4 2 Z" transform="translate(10, 2) scale(0.9)"/>
      <text class="label" x="26" y="5">Total PRs Merged &amp; Built:</text>
      <text class="val" x="430" y="5" text-anchor="end">18</text>
    </g>

    <!-- Row 4: Contributed Repositories -->
    <g class="stat-row" transform="translate(0, 104)" style="animation-delay: 0.3s">
      <path class="icon" d="M 2 1 C 2 -0.66 0.66 -2 -1 -2 C -2.66 -2 -4 -0.66 -4 1 C -4 2.66 -2.66 4 -1 4 C 0.66 4 2 2.66 2 1 Z M -1 -4 C 1.76 -4 4 -1.76 4 1 C 4 3.76 1.76 6 -1 6 C -3.76 6 -6 3.76 -6 1 C -6 -1.76 -3.76 -4 -1 -4 Z" transform="translate(10, 0) scale(0.9)"/>
      <text class="label" x="26" y="5">Total Repositories &amp; Architectures:</text>
      <text class="val" x="430" y="5" text-anchor="end">35+</text>
    </g>
  </g>
</svg>
