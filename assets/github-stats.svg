<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub at a glance for vaibhav2616">
  <title>GitHub at a glance for vaibhav2616</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#12070D"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5B5C7"/>
      <stop offset="50%" stop-color="#C9A27A"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #E5B5C7; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 400; fill: #B6A3AC; }
    .val   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #F8F0F3; }
    .icon  { fill: #C77B9B; }
    .stat-row { animation: row-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes row-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .border-trace { stroke-dasharray: 240 1140; stroke-dashoffset: 1380; animation: trace-move 8s linear infinite; }
    @keyframes trace-move { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .stat-row, .border-trace { animation: none !important; } }
  </style>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="494" height="194" rx="16" fill="url(#bg)" stroke="#43172F" stroke-width="1"/>
  <rect class="border-trace" x="0.5" y="0.5" width="494" height="194" rx="16" fill="none" stroke="url(#trace)" stroke-width="1.8"/>

  <!-- Title Header -->
  <g transform="translate(26, 36)">
